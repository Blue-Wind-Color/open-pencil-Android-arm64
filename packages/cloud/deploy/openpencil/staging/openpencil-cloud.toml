# cloud-staging.openpencil.dev, the official staging deployment. Secrets come from the Worker's
# secrets: BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, S3_ACCESS_KEY_ID, and
# S3_SECRET_ACCESS_KEY; DATABASE_URL is Hyperdrive's.
schema_version = 2

[deployment]
mode = "official"
public_url = "https://cloud-staging.openpencil.dev"
app_url = "https://app.openpencil.dev"
indexing = "deny"
trusted_origins = ["https://app.openpencil.dev", "https://cloud-staging.openpencil.dev"]

[database]

[authentication]
enrollment_mode = "approval"
admin_notification_emails = ["admin@openpencil.dev"]

[authentication.mfa]
deployment_admin_required = false
totp_enabled = false
passkeys_enabled = false
recovery_codes_enabled = false
trusted_device_days = 14

[authentication.email_password]
enabled = false

[authentication.trusted_proxies]
headers = ["cf-connecting-ip"]
addresses = []

[authentication.providers.google]
client_id = { from_env = "GOOGLE_CLIENT_ID" }

[object_storage]
endpoint = "https://br-lucky-forest-aeigmjr4.storage.c-2.us-east-2.aws.neon.tech"
region = "us-east-2"
bucket = "openpencil-cloud-staging"
force_path_style = true
checksum_verification = "metadata"

[email]
transport = "cloudflare"
from = "cloud@openpencil.dev"

[workers.email]
batch_size = 50
interval_ms = 30000
lease_ms = 300000
maximum_attempts = 5

[workers.cleanup]
enabled = true
batch_size = 100
interval_ms = 60000
lease_ms = 300000
document_retention_days = 30

[entitlements]
source = "static"

[entitlements.documents]
maximum_file_bytes = 1_073_741_824
revision_history = true

[entitlements.storage]
maximum_bytes = 107_374_182_400

[entitlements.sharing]
capability_links = true
anonymous_view = true
anonymous_edit = true
guest_presence = true

[entitlements.collaboration]
enabled = true
maximum_participants = 100

[entitlements.ai]
enabled = false
